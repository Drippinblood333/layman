[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "layman-codex"
version = "1.0.0"
description = "An optimization and execution layer for easier, less wasteful, and more reliable Codex development"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "tomlkit>=0.13,<1",
  "uvicorn>=0.35,<1",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pyinstaller==6.22.1",
  "pyinstaller-hooks-contrib==2026.6",
  "build==1.5.0",
  "Pillow==12.3.0",
  "ruff==0.16.3",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
]

[project.scripts]
layman = "layman_router.cli:main"
layman-router = "layman_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/layman_router"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
include = [
  "hatch_build.py",
  "src/layman_router/**/*.py",
  "src/layman_router/**/*.yaml",
  "src/layman_router/**/*.jsonl",
  "src/layman_router/dashboard/*",
  "src/layman_router/bundle/**/*",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
