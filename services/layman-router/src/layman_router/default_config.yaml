listen_host: 127.0.0.1
listen_port: 8787
upstream_base_url: https://api.openai.com/v1
database_path: ~/.layman/usage.sqlite3
admin_token_env: LAYMAN_ROUTER_ADMIN_TOKEN
admin_allow_non_loopback: false
dashboard_enabled: true
demo_mode: false
telemetry_retention_days: 90
upstream_timeout_seconds: 120
price_version: "openai-standard-2026-10-09"
tiers:
  fast:
    model: gpt-6-luna
    reasoning_effort: low
    verbosity: low
    max_output_tokens: 800
    pricing:
      input_per_million: 0.1
      cached_input_per_million: 0.01
      cache_write_per_million: 0.125
      output_per_million: 0.5
      long_context: {threshold_tokens: 272000, input_per_million: 0.2, cached_input_per_million: 0.02, cache_write_per_million: 0.25, output_per_million: 0.75}
  balanced:
    model: gpt-6.1-sol
    reasoning_effort: medium
    verbosity: low
    max_output_tokens: 1500
    pricing:
      input_per_million: 2.0
      cached_input_per_million: 0.1
      cache_write_per_million: 2.5
      output_per_million: 10.0
      long_context: {threshold_tokens: 272000, input_per_million: 4.0, cached_input_per_million: 0.2, cache_write_per_million: 5.0, output_per_million: 15.0}
  deep:
    model: gpt-6-astra
    reasoning_effort: high
    verbosity: medium
    max_output_tokens: 2500
    pricing:
      input_per_million: 10.0
      cached_input_per_million: 1.0
      cache_write_per_million: 12.5
      output_per_million: 50.0
      long_context: {threshold_tokens: 272000, input_per_million: 20.0, cached_input_per_million: 2.0, cache_write_per_million: 25.0, output_per_million: 75.0}
projects:
  default:
    default_quality: standard
    default_budget: medium
    rules: {}
