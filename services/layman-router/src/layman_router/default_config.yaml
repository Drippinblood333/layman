listen_host: 127.0.0.1
listen_port: 8787
upstream_base_url: https://api.openai.com/v1
database_path: ~/.layman/usage.sqlite3
admin_token_env: LAYMAN_ROUTER_ADMIN_TOKEN
admin_allow_non_loopback: false
dashboard_enabled: true
demo_mode: false
telemetry_retention_days: 90
upstream_timeout_seconds: 120
price_version: "openai-standard-2026-07-16"
tiers:
  fast:
    model: gpt-5.6-luna
    reasoning_effort: low
    max_output_tokens: 8000
    pricing: {input_per_million: 1.0, cached_input_per_million: 0.1, cache_write_per_million: 1.25, output_per_million: 6.0}
  balanced:
    model: gpt-5.6-terra
    reasoning_effort: medium
    max_output_tokens: 16000
    pricing: {input_per_million: 2.5, cached_input_per_million: 0.25, cache_write_per_million: 3.125, output_per_million: 15.0}
  deep:
    model: gpt-5.6-sol
    reasoning_effort: high
    max_output_tokens: 32000
    pricing: {input_per_million: 5.0, cached_input_per_million: 0.5, cache_write_per_million: 6.25, output_per_million: 30.0}
projects:
  default:
    default_quality: standard
    default_budget: medium
    rules: {}
