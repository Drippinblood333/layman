services:
  layman-router:
    build:
      context: ../..
      dockerfile: services/layman-router/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LAYMAN_ROUTER_ADMIN_TOKEN: ${LAYMAN_ROUTER_ADMIN_TOKEN}
      LAYMAN_ROUTER_HOST: 0.0.0.0
      LAYMAN_ROUTER_ADMIN_ALLOW_NON_LOOPBACK: "true"
      LAYMAN_ROUTER_DATABASE_PATH: /data/layman-router.sqlite3
    volumes:
      - ./data:/data
